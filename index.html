<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMPP STUDIOS | High-Quality Unreal Engine Systems</title>
    <meta name="description" content="MMPP Studios specializing in production-ready Unreal Engine systems and multiplayer gameplay tools. Clean, modular, and well-documented assets for developers.">
    <meta name="keywords" content="Unreal Engine, UE5, Multiplayer Systems, Gameplay Tools, C++, Blueprints, MMPP Studios">
    <meta name="author" content="MMPP Studios">
    <meta name="robots" content="index, follow">

    <meta property="og:title" content="MMPP STUDIOS">
    <meta property="og:description" content="Advanced Unreal Engine systems for modern developers.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mmppstudios.com">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            background-color: black;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 50px 20px 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            min-height: 1.2em;
        }

        /* Színosztályok, amiket a kártyánál is használunk */
        .color-mm { color: #FF5D9CFF; }
        .color-pp { color: #005A6CFF; }
        .color-studios { color: #FF9800FF; }

        p.main-desc {
            font-size: 18px;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            min-height: 3em;
            color: #cccccc;
        }

        .cursor {
            display: inline-block;
            background-color: white;
            animation: blink 1s infinite;
            margin-left: 5px;
            vertical-align: middle;
        }

        .cursor-l { width: 12px; height: 40px; }
        .cursor-s { width: 8px; height: 18px; }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .products-wrapper {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 50px;
            opacity: 0;
            transition: opacity 1.5s ease-in;
            width: 100%;
            max-width: 1000px;
            flex-wrap: wrap;
        }

        .products-wrapper.visible {
            opacity: 1;
        }

        .product-card {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            background-color: #0a0a0a;
            border: 1px solid #333;
            width: 280px;
            padding: 20px;
            border-radius: 4px;
            text-align: left;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .product-card:hover {
            border-color: #fff;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.05);
        }

        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background-color: #222;
            margin-bottom: 15px;
            border-radius: 2px;
        }

        .product-card h3 {
            font-size: 20px;
            margin: 0 0 10px 0;
        }

        .product-card p.card-desc {
            font-size: 14px;
            margin: 0 0 20px 0;
            line-height: 1.4;
            flex-grow: 1;
        }

        .product-card .card-link {
            font-size: 14px;
            font-weight: bold;
            display: block;
            margin-top: auto;
        }

        .social-wrapper {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 40px 0 30px 0;
            width: 100%;
            opacity: 0;
            transition: opacity 1.5s ease-in;
        }

        .social-wrapper.visible {
            opacity: 1;
        }

        .social-icon {
            color: #777;
            font-size: 28px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            color: #FF5D9CFF;
            transform: scale(1.2) translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="main-content">
        <!-- title description -->
        <h1><span id="header-mm" class="color-mm"></span><span id="header-pp" class="color-pp"></span><span id="header-studios" class="color-studios"></span><span id="cursor-h" class="cursor cursor-l"></span></h1>
        <p class="main-desc"><span id="description"></span><span id="cursor-d" class="cursor cursor-s" style="display:none;"></span></p>

        <!-- assets section -->
        <div class="products-wrapper" id="products">
            <a href="https://www.fab.com/listings/ad74ca85-c908-4507-a93d-adddc25f8a59" class="product-card">
                <img src="assets/AMTF_FAB_Main.png" alt="Multiplayer Grenade & Throwable System – AI & Trajectory (AMTF)">
                <!-- Cím: Rózsaszín -->
                <h3 class="color-mm">Multiplayer Grenade & Throwable System – AI & Trajectory (AMTF)</h3>
                <!-- Leírás: Kék -->
                <p class="card-desc color-pp">Add a high-performance, production-ready ballistic simulation system to your Unreal Engine project in minutes.</p>
                <!-- Link: Sárga/Narancs -->
                <span class="card-link color-studios">&gt; View Product @Fab</span>
            </a>
        </div>
    </div>

    <!-- Social Icons -->
    <div class="social-wrapper" id="socials">
        <a href="https://www.fab.com/sellers/MMPPStudios" target="_blank" class="social-icon" title="Fab.com"><i class="fa-solid fa-store"></i></a>
        <a href="https://www.youtube.com/@MMPPStudios" target="_blank" class="social-icon" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
        <a href="https://x.com/MMPPStudios" target="_blank" class="social-icon" title="X (Twitter)"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="https://bsky.app/profile/mmppstudios.bsky.social" target="_blank" class="social-icon" title="Blue Sky"><i class="fa-brands fa-bluesky"></i></a>
        <a href="https://mmppstudios.itch.io/" target="_blank" class="social-icon" title="itch.io"><i class="fa-brands fa-itch-io"></i></a>
        <a href="https://www.tiktok.com/@mmppstudios" target="_blank" class="social-icon" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
    </div>

    <script>
        const descText = "MMPP Studios is an independent developer specializing in high-quality Unreal Engine systems and gameplay tools. We provide clean, modular, and production-ready assets designed to streamline the development of complex multiplayer mechanics. Our mission is to empower developers with well-documented solutions that are easy to integrate and scale.";

        function typeWriter(text, elementId, speed, cursorId, callback) {
            let i = 0;
            const element = document.getElementById(elementId);
            const cursor = document.getElementById(cursorId);

            if(cursor) cursor.style.display = "inline-block";

            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else if (callback) {
                    callback();
                }
            }
            type();
        }

        // Láncolt hívások
        window.onload = () => {
            typeWriter("MM", "header-mm", 100, "cursor-h", () => {
                typeWriter("PP", "header-pp", 100, "cursor-h", () => {
                    typeWriter(" STUDIOS", "header-studios", 100, "cursor-h", () => {
                        typeWriter(descText, "description", 5, "cursor-d", () => {
                            // Megjelenítjük a kártyákat és a social ikont
                            document.getElementById("products").classList.add("visible");
                            document.getElementById("socials").classList.add("visible");
                        });
                    });
                });
            });
        };
    </script>
</body>
</html>
